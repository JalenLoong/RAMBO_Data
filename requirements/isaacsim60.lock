# Fully resolved package snapshot for the validated RAMBO Isaac Sim 6 runtime.
# Generated from /workspace/venvs/rambo60 with `python -m pip freeze --all`.
# Isaac Lab VCS entries are intentionally pinned to v3.0.0-beta2.patch1 commit
# ffff603eafc6b74264a5261cc0183d6a65390d78.  RAMBO/CRL2 are editable from
# this repository checkout; the corresponding RAMBO commit is recorded in
# host-manifest.json.  Bare Newton distributions below are transitive package
# graph members only: RAMBO must still explicitly select and assert PhysX.

